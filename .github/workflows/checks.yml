name: OrkSearch checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3 with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring
      - name: Run regression tests
        run: |
          bash Test/package.test.sh
          node Test/pinned-navigation.test.js
      - name: Build package
        run: bash scripts/build-release.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrkSearch-package
          path: dist/OrkSearch-*.zip
